filebeat.inputs:
  - type: filestream
    id: application-json-logs
    enabled: true
    prospector.scanner.fingerprint.length: 64
    paths:
      - /var/log/app/*.json
    parsers:
      - ndjson:
          target: ""
          add_error_key: true

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
