input {
  beats {
    port => 5044
  }
}

filter {
  # Convert Pino's Unix epoch milliseconds to the event timestamp.
  if [time] {
    date {
      match => ["time", "UNIX_MS"]
      target => "@timestamp"
      tag_on_failure => ["_pino_timestamp_parse_failure"]
    }
  }

  # Add environment metadata for easier filtering.
  mutate {
    add_field => {
      "environment" => "development"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-write"
    ilm_enabled => false
  }

  stdout {
    codec => rubydebug
  }
}
